# Socket remediation: patch first, then report what still needs an upgrade.
#
# The order is deliberate. A Socket patch leaves the installed version exactly
# where it is and rewrites the lockfile to pull a fixed build of that same
# version, so nothing downstream has to be retested. An upgrade changes the
# version and can change behaviour. So this workflow applies every available
# patch, proves the app still works, and only then reports the upgrades that are
# genuinely still required.
#
# Runs with no secrets at all: without a token socket-patch uses the public
# patch proxy, which serves the free-tier patches. Add SOCKET_API_TOKEN to pull
# your organization's full patch catalogue, and SOCKET_CLI_API_TOKEN to include
# the Socket Fix upgrade plan in the report.

name: Socket remediation

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open a pull request with the patched lockfile
        type: boolean
        default: true
  schedule:
    # Mondays at 06:17 UTC. GitHub disables scheduled workflows after ~60 days
    # of repository inactivity, so re-enable this from the Actions tab if the
    # repo goes quiet.
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: socket-remediate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Both optional, and both mapped here rather than on the step that uses
      # them: the `secrets` context is not available in a step-level `if`, but
      # `env` is, so this is what lets the Socket Fix step skip itself cleanly
      # when no token is configured.
      #
      # No SOCKET_API_TOKEN      -> public patch proxy, free-tier patches only.
      # No SOCKET_CLI_API_TOKEN  -> the upgrade plan is omitted from the report.
      SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN }}
      SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Baseline. If the app is already broken, a later failure tells us nothing
      # about the patches.
      - name: Smoke test before patching
        run: npm run smoke

      - name: Install socket-patch
        run: |
          curl -fsSL https://install.socket.dev/patch \
            | SOCKET_PATCH_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show socket-patch version
        run: socket-patch --version

      # Read-only. Lists what is available without touching the tree, which is
      # what the report is built from. `scan --json` on its own never mutates;
      # a --mode flag is what makes it apply anything.
      - name: Inventory available patches
        run: socket-patch scan --json > socket-patch-inventory.json

      - name: Summarise inventory
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('socket-patch-inventory.json'))
          print('## Socket Patches inventory\n')
          print(f"- packages scanned: **{d.get('scannedPackages', 0)}**")
          print(f"- packages with patches available: **{d.get('packagesWithPatches', 0)}**")
          print(f"- patches: **{d.get('totalPatches', 0)}** "
                f"({d.get('freePatches', 0)} free, {d.get('paidPatches', 0)} org-tier)")
          if not d.get('canAccessPaidPatches', False):
              print('\n> No API token, so only free-tier patches are listed. '
                    'Set the `SOCKET_API_TOKEN` secret for the full catalogue.')
          PY

      # Hosted mode: rewrites `resolved` + `integrity` in the lockfile to point
      # at Socket's patch server. The dependency version is unchanged and no
      # patch bytes are committed, so the diff stays a couple of lines per
      # package. The alternatives are `--mode vendored` (commits the patched
      # artifacts for hermetic/offline installs) and `--mode agent` (re-applies
      # patches at install time via a postinstall hook).
      - name: Apply patches (hosted mode)
        run: |
          socket-patch scan --mode hosted --json --yes > socket-patch-applied.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d = json.load(open('socket-patch-applied.json'))
          r = d.get('redirect') or {}
          print(f"PATCHES_APPLIED={r.get('redirected', 0)}")
          PY

      - name: Show lockfile diff
        run: |
          echo "Patched packages: ${PATCHES_APPLIED:-0}"
          git --no-pager diff --stat
          {
            echo '## Lockfile changes'
            echo
            echo '```diff'
            git --no-pager diff -- package-lock.json | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Installs the patched tarballs. The lockfile stays in sync with
      # package.json because no version changed, so `npm ci` is still valid.
      - name: Reinstall from the patched lockfile
        if: env.PATCHES_APPLIED != '0'
        run: npm ci

      # The load-bearing check: same app, same versions, no behaviour change.
      - name: Smoke test after patching
        if: env.PATCHES_APPLIED != '0'
        run: npm run smoke

      # OpenVEX 0.2.0. Each statement is `not_affected` with the justification
      # `inline_mitigations_already_exist`, which is how a scanner that consumes
      # VEX learns the advisory is mitigated even though the version still looks
      # vulnerable. Generated after the reinstall so it can hash the files on
      # disk rather than trusting the manifest.
      - name: Generate OpenVEX attestation
        if: env.PATCHES_APPLIED != '0'
        run: socket-patch vex --output socket-patches.openvex.json

      - name: Verify the patches landed
        if: env.PATCHES_APPLIED != '0'
        run: npm run verify
        env:
          VEX_PATH: socket-patches.openvex.json

      # ----------------------------------------------------------------------
      # Socket Fix, in report-only mode. No GitHub token is passed to this step,
      # so it cannot open pull requests; --no-apply-fixes keeps the tree clean.
      # The upgrade PRs are the separate socket-fix-prs.yml workflow.
      # ----------------------------------------------------------------------
      - name: Compute the remaining upgrade plan
        id: fixplan
        if: env.SOCKET_CLI_API_TOKEN != ''
        # Socket Fix installs its analysis engine (@coana-tech/cli) through the
        # Socket-wrapped package manager, so the engine install is itself
        # policy-evaluated. In an organization whose policy action for
        # `recentlyPublished` is `error`, that install is blocked and this step
        # fails. The patch work above is already done by then, so the failure is
        # tolerated and costs only the upgrade half of the report. Fix it
        # properly with a package-scoped policy exception for @coana-tech/cli.
        continue-on-error: true
        run: |
          npm install -g socket@1.1.170
          socket fix \
            --no-apply-fixes \
            --no-major-updates \
            --output-file socket-fix-plan.json
          echo "have_plan=true" >> "$GITHUB_OUTPUT"

      - name: Build the remediation report
        run: |
          if [ -f socket-fix-plan.json ]; then
            node scripts/remediation-plan.mjs \
              socket-patch-inventory.json socket-fix-plan.json > remediation-plan.md
          else
            node scripts/remediation-plan.mjs socket-patch-inventory.json > remediation-plan.md
          fi
          cat remediation-plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: socket-remediation-evidence
          path: |
            socket-patch-inventory.json
            socket-patch-applied.json
            socket-patches.openvex.json
            socket-fix-plan.json
            remediation-plan.md
          if-no-files-found: warn
          retention-days: 30

      - name: Assemble the pull request body
        if: env.PATCHES_APPLIED != '0'
        run: |
          {
            echo "Applied **${PATCHES_APPLIED}** Socket patch(es) in hosted mode."
            echo
            echo "Every dependency version in this diff is **unchanged**. Only \`resolved\`"
            echo "and \`integrity\` move, from the public registry to Socket's patch server,"
            echo "so the install pulls a fixed build of the same version. The app's smoke"
            echo "tests ran before and after and produced identical results."
            echo
            echo "\`socket-patches.openvex.json\` is an OpenVEX 0.2.0 attestation covering"
            echo "these advisories. Point a VEX-aware scanner at it so the patched packages"
            echo "stop being reported as vulnerable."
            echo
            cat remediation-plan.md
            echo
            echo "---"
            echo "Generated by [\`socket-remediate.yml\`](.github/workflows/socket-remediate.yml) · run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > pr-body.md
          cat pr-body.md

      - name: Open a pull request
        if: >-
          env.PATCHES_APPLIED != '0' &&
          (github.event_name == 'schedule' || inputs.open_pr)
        uses: peter-evans/create-pull-request@v8
        with:
          branch: socket/patches
          base: ${{ github.ref_name }}
          title: "Socket Patches: fix ${{ env.PATCHES_APPLIED }} package(s) without upgrading"
          body-path: pr-body.md
          commit-message: |
            Apply Socket patches in hosted mode

            Repoints ${{ env.PATCHES_APPLIED }} lockfile entries at Socket's patch
            server. No dependency version changes.
          # .socket/vendor/redirect-state.json holds the original lockfile
          # fragments and is what `socket-patch vex` reads. Committing it keeps
          # the attestation reproducible from a fresh clone and leaves
          # `socket-patch vendor --revert` able to undo the change. Drop it from
          # the add list if you would rather keep the diff to the lockfile alone
          # and treat the VEX document as a build artifact.
          add-paths: |
            package-lock.json
            .socket/**
            socket-patches.openvex.json
          delete-branch: true
          labels: socket-patches
