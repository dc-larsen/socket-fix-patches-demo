# Socket remediation: upgrade what is easy, patch the rest.
#
# Two phases on one checkout, ending in one pull request.
#
#   Phase 1  Socket Fix, restricted to minor and patch upgrades
#            (--no-major-updates). Same major version, so no API break is
#            expected, and the dependency moves onto a maintained release.
#            Runs in local mode so the upgrades land in this working tree
#            instead of in separate pull requests.
#
#   Phase 2  Socket Patches, hosted mode, on whatever is still vulnerable
#            after phase 1: advisories whose only fix is a major bump,
#            advisories with no fixed release at all, and advisories the
#            freshly upgraded version still carries. The installed version does
#            not change; the lockfile is repointed at a patched build of it.
#
# The smoke suite runs three times: before anything, after the upgrades, and
# after the patches. A failure after the upgrades fails the run. An "easy"
# upgrade that breaks the app is not easy, and it should not reach a pull
# request.
#
# Secrets are optional. With no SOCKET_CLI_API_TOKEN, phase 1 is skipped and
# this is a patches-only run. With no SOCKET_API_TOKEN, socket-patch uses the
# public proxy and free-tier patches only.

name: Socket remediation

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open a pull request with the result
        type: boolean
        default: true
  schedule:
    # Mondays 06:17 UTC. GitHub disables scheduled workflows after ~60 days of
    # repository inactivity; re-enable from the Actions tab if it goes quiet.
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: socket-remediate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Mapped at job level because the `secrets` context is not available in a
      # step-level `if`, but `env` is.
      SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN }}
      SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Initialise counters
        run: |
          {
            echo "FIX_UPGRADES=0"
            echo "FIX_ADVISORIES=0"
            echo "PATCHES_APPLIED=0"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # Baseline. If the app is already broken, later failures prove nothing.
      - name: Smoke test before any change
        run: npm run smoke

      # ----------------------------------------------------------------------
      # Phase 1: upgrade what is easy
      # ----------------------------------------------------------------------
      - name: Install the Socket CLI
        if: env.SOCKET_CLI_API_TOKEN != ''
        run: |
          npm install -g socket@1.1.170
          socket --version

      # Local mode is deliberate. Socket Fix only switches to CI mode (opening
      # its own pull requests) when ALL FOUR of CI, SOCKET_CLI_GITHUB_TOKEN,
      # SOCKET_CLI_GIT_USER_NAME and SOCKET_CLI_GIT_USER_EMAIL are set. Actions
      # sets CI; nothing here sets the other three, so the upgrades land in this
      # working tree and ship in the single pull request below. The "CI mode
      # detected, but pull request creation is disabled" notice it prints is
      # expected.
      #
      # --no-major-updates is what "easy" means here. --minimum-release-age
      # skips versions younger than a week, so a malicious release has time to
      # be pulled before this upgrades into it.
      - name: "Phase 1: upgrade what is easy (Socket Fix, minor and patch only)"
        id: fix
        if: env.SOCKET_CLI_API_TOKEN != ''
        continue-on-error: true
        run: |
          socket fix \
            --all \
            --no-major-updates \
            --minimum-release-age 7d \
            --output-file socket-fix-applied.json

      # Socket Fix installs its analysis engine (@coana-tech/cli) through the
      # Socket-wrapped package manager, so that install is itself policy
      # evaluated. In an organization whose policy action for
      # `recentlyPublished` is `error`, the engine is blocked and phase 1 fails
      # before computing anything. Revert any partial edit so phase 2 runs on
      # the original tree. The lasting fix is a package-scoped policy exception
      # for @coana-tech/cli.
      - name: Undo phase 1 if it failed
        if: steps.fix.outcome == 'failure'
        run: |
          echo "::warning::Socket Fix failed, so this run is patches-only. If the log shows @coana-tech/cli blocked on recentlyPublished, add a policy exception for that package."
          git checkout -- package.json package-lock.json
          rm -f socket-fix-applied.json

      - name: Record phase 1 results
        if: steps.fix.outcome == 'success'
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d = json.load(open('socket-fix-applied.json'))
          fixes = d.get('fixes') or {}
          packages = {u['purl'].rsplit('@', 1)[0] for ups in fixes.values() for u in ups}
          print(f"FIX_ADVISORIES={len(fixes)}")
          print(f"FIX_UPGRADES={len(packages)}")
          PY

      - name: Install the upgraded dependencies
        run: npm ci

      # The gate that matters most. Fails the run if an upgrade broke the app.
      - name: Smoke test after upgrades
        run: npm run smoke

      # ----------------------------------------------------------------------
      # Phase 2: patch the rest
      # ----------------------------------------------------------------------
      - name: Install socket-patch
        run: |
          curl -fsSL https://install.socket.dev/patch \
            | SOCKET_PATCH_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Hosted mode rewrites only `resolved` and `integrity` in the lockfile so
      # the still-vulnerable packages install from Socket's patch server. The
      # version field does not move. `scan --json` without a --mode flag would
      # be read-only; the flag is what applies.
      - name: "Phase 2: patch the rest (Socket Patches, hosted mode)"
        run: |
          socket-patch --version
          socket-patch scan --mode hosted --json --yes > socket-patch-applied.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d = json.load(open('socket-patch-applied.json'))
          print(f"PATCHES_APPLIED={(d.get('redirect') or {}).get('redirected', 0)}")
          PY

      - name: Install the patched dependencies
        if: env.PATCHES_APPLIED != '0'
        run: npm ci

      - name: Smoke test after patches
        if: env.PATCHES_APPLIED != '0'
        run: npm run smoke

      # OpenVEX 0.2.0. Each statement is `not_affected` with justification
      # `inline_mitigations_already_exist`: the advisory is mitigated even
      # though the version string still looks vulnerable. Generated after the
      # reinstall so it hashes the files on disk.
      - name: Generate OpenVEX attestation
        if: env.PATCHES_APPLIED != '0'
        run: socket-patch vex --output socket-patches.openvex.json

      - name: Verify the patches landed
        if: env.PATCHES_APPLIED != '0'
        run: npm run verify
        env:
          VEX_PATH: socket-patches.openvex.json

      # ----------------------------------------------------------------------
      # Report
      # ----------------------------------------------------------------------
      - name: Build the remediation report
        run: |
          node scripts/remediation-plan.mjs socket-fix-applied.json socket-patch-applied.json \
            > remediation-plan.md
          {
            cat remediation-plan.md
            echo
            echo '## Files changed'
            echo
            echo '```'
            git --no-pager diff --stat
            echo '```'
            echo
            echo '<details><summary>package.json diff</summary>'
            echo
            echo '```diff'
            git --no-pager diff -- package.json
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: socket-remediation-evidence
          path: |
            socket-fix-applied.json
            socket-patch-applied.json
            socket-patches.openvex.json
            remediation-plan.md
          if-no-files-found: warn
          retention-days: 30

      - name: Assemble the pull request body
        if: env.FIX_UPGRADES != '0' || env.PATCHES_APPLIED != '0'
        run: |
          {
            echo "**Phase 1** upgraded **${FIX_UPGRADES}** package(s), closing **${FIX_ADVISORIES}** advisories. Minor and patch bumps only."
            echo
            echo "**Phase 2** patched **${PATCHES_APPLIED}** package(s) that were still vulnerable after phase 1. Their versions are unchanged: \`resolved\` and \`integrity\` now point at Socket's patch server, and \`socket-patches.openvex.json\` attests to what was mitigated."
            echo
            echo "The smoke suite passed before, between, and after the two phases."
            echo
            cat remediation-plan.md
            echo
            echo "---"
            echo "Generated by [\`socket-remediate.yml\`](.github/workflows/socket-remediate.yml) · run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > pr-body.md
          cat pr-body.md

      # Everything not gitignored is committed: package.json,
      # package-lock.json, .socket/vendor/redirect-state.json (the file
      # `socket-patch vex` reads, so the attestation is reproducible from a
      # clone) and the OpenVEX document. Run outputs are gitignored.
      - name: Open a pull request
        if: >-
          (env.FIX_UPGRADES != '0' || env.PATCHES_APPLIED != '0') &&
          (github.event_name == 'schedule' || inputs.open_pr)
        uses: peter-evans/create-pull-request@v8
        with:
          branch: socket/remediation
          base: ${{ github.ref_name }}
          title: "Socket remediation: ${{ env.FIX_UPGRADES }} upgrade(s), ${{ env.PATCHES_APPLIED }} patch(es)"
          body-path: pr-body.md
          commit-message: |
            Socket remediation: upgrade what is easy, patch the rest

            Phase 1 (Socket Fix, minor and patch only): ${{ env.FIX_UPGRADES }}
            package(s) upgraded, covering ${{ env.FIX_ADVISORIES }} advisories.
            Phase 2 (Socket Patches, hosted): ${{ env.PATCHES_APPLIED }} package(s)
            repointed at the patch server, versions unchanged.
          delete-branch: true
          labels: socket-remediation
